# TensorFold (ROCm/HIP) serving Qwen3.8 Flash Next on a Strix Halo, on 127.0.0.1:8080.
# start.sh checks the host, fills .env (MODEL_DIR, the host's video/render GIDs) and runs `docker compose up -d`.
# By hand: copy env.example to .env, set it, then `docker compose -f docker/rocm-serve/compose.yaml up -d`.
# Build (repo root, no GPU needed): docker build -t tensorfold-rocm:dev docker/rocm-dev
#   && docker build -f docker/rocm-serve/Dockerfile -t tensorfold-rocm:serve .   (--build-arg PM4=0: stock runtime only)
name: tensorfold

services:
  tensorfold:
    image: tensorfold-rocm:serve
    container_name: tensorfold
    init: true
    network_mode: host
    ipc: host
    devices: [/dev/kfd, /dev/dri]
    # numeric host GIDs: /dev/kfd and /dev/dri/renderD* belong to the host's video/render groups, whose GIDs vary
    group_add: ["${VIDEO_GID:?set VIDEO_GID in .env (getent group video)}", "${RENDER_GID:?set RENDER_GID in .env (getent group render)}"]
    restart: unless-stopped
    stop_grace_period: 60s
    ulimits:
      memlock: -1
      stack: 67108864
    # image defaults: TENSORFOLD_CUDA_KERNELS (the baked set), TF_FLASHNEXT_DEPTH=15, HF_HUB_OFFLINE=1 and, PM4=1
    # images, the PM4 libs first on LD_LIBRARY_PATH + DEBUG_HIP_GRAPH_PM4=1 + GPU_MAX_HW_QUEUES=1. Stock ROCm 10.0
    # runtime from a PM4 image: LD_LIBRARY_PATH: "", DEBUG_HIP_GRAPH_PM4: "0", GPU_MAX_HW_QUEUES: "4"
    environment:
      TENSORFOLD_MEMORY_RESERVE_GIB: "12"
    # read-only: serving maps the weights and the n-gram table and writes nothing (the prompt cache lives in memory)
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR in .env}:/models/qwen38fn-int4-autoround:ro
    command:
      - serve
      - /models/qwen38fn-int4-autoround
      - --name=qwen3.8-flash-next
      - --host=127.0.0.1
      - --port=8080
      - --context=262144
      - --parallel=8
      - --kv-dtype=fp8
      - --thinking
      - --backend=hip
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
